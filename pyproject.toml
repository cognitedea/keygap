[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitedea-keygap"
version = "0.1.0"
description = "按段落统计密钥轮转的中断窗口相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cognitedea" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cognitedea.github.io"
Repository = "https://github.com/cognitedea/keygap"
Issues = "https://github.com/cognitedea/keygap/issues"

[project.scripts]
keygap = "keygap:main"

[tool.setuptools]
py-modules = ["keygap"]
